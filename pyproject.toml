[project]
name = "worker-selection-app"
version = "2.0.0"
description = "AI platform for industrial worker selection and retention prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.43.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "numpy>=2.3.3",
    "catboost>=1.2.8",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
